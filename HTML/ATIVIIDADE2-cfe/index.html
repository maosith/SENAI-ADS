<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <img id="grande" style="width: 400px;height:  400px;" src="./imagens/197.png">
        </div>
        <div class="row">
             <div class="col-6">
                
            <img style="width: 75px;"  src="./imagens/007.png" onmouseover="trocar (this)">
            <img style="width: 75px;" src="./imagens/134.png" onmouseover="trocar (this)">
            <img style="width: 75px;" src="./imagens/151.png" onmouseover="trocar (this)">

        </div> 
        <div class="col-6"></div>
    </div>
</div>
<script>
    let fotoGrande = document.querySelector('#grande');
    function trocar (nova){
        let vazio = fotoGrande.src;
        fotoGrande.src = nova.src;
        nova.src = vazio;
    }
</script>
</body>
</html>
